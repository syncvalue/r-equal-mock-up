<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GMOサイン（ダミー）</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <style>
    body { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
    .inp { border: 1px solid #94a3b8; border-radius: .375rem; padding: .6rem .75rem; width: 100%; background: #fff; }
    .b { border-radius: .375rem; padding: .65rem 1.2rem; font-weight: 700; min-height: 44px; }
    .b-pri { background: #0369a1; color: #fff; } .b-sec { background: #fff; border: 1px solid #94a3b8; }
    .b:disabled { opacity: .4; }
    #print-area { display: none; }
    @page { size: A4; margin: 0; }
    @media print { #root { display: none !important; } #print-area { display: block !important; } body { background: #fff; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>
  <div id="print-area"></div>
  <script type="module" src="/gmosign/gmosign.js"></script>
</body>
</html>

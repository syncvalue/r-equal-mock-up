<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>マスタ管理（ダミー）</title>
  <script>(function(){try{var t=localStorage.getItem('rq-theme');var d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;if(d)document.documentElement.classList.add('dark')}catch(e){}})()</script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <style>
    body { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
    .inp { border: 1px solid #94a3b8; border-radius: .375rem; padding: .6rem .75rem; width: 100%; background: #fff; }
    .b { border-radius: .375rem; padding: .65rem 1.2rem; font-weight: 700; min-height: 44px; }
    .b-pri { background: #0f766e; color: #fff; } .b-sec { background: #fff; border: 1px solid #94a3b8; }
    .b.on { background: #0f766e; color: #fff; border: 1px solid #0f766e; }
    .b:disabled { opacity: .4; }
    th, td { padding: .4rem .4rem; white-space: nowrap; }
  </style>
  <link rel="stylesheet" href="/src/theme.css" />
</head>
<body class="bg-slate-100 text-slate-800 overflow-hidden">
  <div id="root"></div>
  <script type="module" src="/master/master.js"></script>
</body>
</html>
